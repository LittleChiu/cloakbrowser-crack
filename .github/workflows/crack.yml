name: crack

# Rebuilds a keyless CloakBrowser Manager for every platform the vendor ships.
#
# The license check lives in the engine, not in the manager: the engine binary
# is patched so every license denial call site branches straight into the
# enclosing function's epilogue instead of exiting, and the 31 s
# fingerprint-table wait is shortened.  The manager is then repackaged with the
# patched engine and a launcher stub that points it at the vendored engine.

on:
  workflow_dispatch:
    inputs:
      version:
        description: engine version ("" = latest)
        required: false
        default: ""
      key:
        description: license key used only to download the engine
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64]
    env:
      ENGINE_VERSION: ${{ inputs.version }}
      CB_KEY: ${{ inputs.key || secrets.CLOAKBROWSER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install --quiet --break-system-packages capstone

      - name: fetch release assets
        run: |
          set -euo pipefail
          # the licence key allows one concurrent download: retry on 429/403
          dl() {
            local url=$1 plat=$2 out=$3
            for i in 1 2 3 4 5; do
              code=$(curl -sSL --retry 3 -H "Authorization: Bearer $CB_KEY" \
                -H "X-Platform: $plat" -o "$out.tmp" -w '%{http_code}' "$url" || echo 000)
              if [ "$code" = 200 ]; then mv "$out.tmp" "$out"; return 0; fi
              echo "download $plat -> HTTP $code (attempt $i)"
              [ "$code" = 403 ] || [ "$code" = 429 ] || [ "$code" = 000 ] || {
                head -c 400 "$out.tmp" 2>/dev/null; return 1; }
              sleep $((i * 15))
            done
            echo "download $plat failed" >&2
            return 1
          }
          # asset names carry the manager version: resolve them
          tag=$(curl -fsS https://api.github.com/repos/CloakHQ/CloakBrowser-Manager/releases/latest |
                sed -n 's/.*"\(CloakBrowser-Manager-v[0-9.]*-universal\.dmg\)".*/\1/p' | head -1)
          [ -n "$tag" ] || { echo "no dmg asset in the latest release"; exit 1; }
          curl -fsSL -o manager.dmg \
            "https://github.com/CloakHQ/CloakBrowser-Manager/releases/latest/download/$tag"
          ver=${ENGINE_VERSION:-$(curl -fsS https://cloakbrowser.dev/api/download/version | sed 's/.*"version":"\([^"]*\)".*/\1/')}
          echo "engine $ver / ${{ matrix.target }}"
          dl "https://cloakbrowser.dev/api/download/$ver" ${{ matrix.target }} engine.tar.gz
          mkdir engine && tar xzf engine.tar.gz -C engine

      - name: derive patch plan
        run: |
          set -euo pipefail
          FW="engine/Chromium.app/Contents/Frameworks/Chromium Framework.framework/Versions/Current/Chromium Framework"
          file "$FW"
          python3 cloakcrack.py derive "$FW" --out plan.json
          python3 cloakcrack.py patch  "$FW" --sites plan.json

      - name: package
        run: package/package.sh macos engine/Chromium.app out

      - name: verify
        run: package/verify.sh out/CloakBrowser\ Manager.app/Contents/Resources/engine/Chromium.app

      - uses: actions/upload-artifact@v4
        with:
          name: CloakBrowser-Manager-${{ matrix.target }}
          path: out

  windows:
    needs: macos
    runs-on: windows-latest
    env:
      ENGINE_VERSION: ${{ inputs.version }}
      CB_KEY: ${{ inputs.key || secrets.CLOAKBROWSER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet --break-system-packages capstone

      - name: toolchain
        run: choco install mingw -y --no-progress

      - name: fetch release assets
        run: |
          set -euo pipefail
          # the licence key allows one concurrent download: retry on 429/403
          dl() {
            local url=$1 plat=$2 out=$3
            for i in 1 2 3 4 5; do
              code=$(curl -sSL --retry 3 -H "Authorization: Bearer $CB_KEY" \
                -H "X-Platform: $plat" -o "$out.tmp" -w '%{http_code}' "$url" || echo 000)
              if [ "$code" = 200 ]; then mv "$out.tmp" "$out"; return 0; fi
              echo "download $plat -> HTTP $code (attempt $i)"
              [ "$code" = 403 ] || [ "$code" = 429 ] || [ "$code" = 000 ] || {
                head -c 400 "$out.tmp" 2>/dev/null; return 1; }
              sleep $((i * 15))
            done
            echo "download $plat failed" >&2
            return 1
          }
          ver=$(curl -fsS https://cloakbrowser.dev/api/download/version | sed 's/.*"version":"\([^"]*\)".*/\1/')
          [ -n "$ENGINE_VERSION" ] && ver=$ENGINE_VERSION
          echo "engine $ver"
          dl "https://cloakbrowser.dev/api/download/$ver" windows-x64 engine.zip
          # the manager installs over this tree; the engine keeps its own dir
          mkdir -p app/Engine && cd app/Engine && unzip -q ../../engine.zip && cd ../..
          # the asset name carries the manager version: look it up
          tag=$(curl -fsS https://api.github.com/repos/CloakHQ/CloakBrowser-Manager/releases/latest |
                sed -n 's/.*"\(CloakBrowser-Manager-v[0-9.]*-setup\.exe\)".*/\1/p' | head -1)
          curl -fsSL -o setup.exe \
            "https://github.com/CloakHQ/CloakBrowser-Manager/releases/latest/download/$tag"

      - name: install manager silently
        run: |
          # Inno Setup: /DIR must be absolute; the installer is not extractable
          # with innoextract yet, so run it for real.
          ./setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="$(cygpath -w "$PWD/app")"
          ls app

      - name: derive patch plan
        run: |
          set -euo pipefail
          DLL=app/Engine/chrome.dll
          [ -f "$DLL" ] || DLL=$(find app -name chrome.dll | head -1)
          file "$DLL"
          python3 cloakcrack.py derive "$DLL" --out plan.json
          python3 cloakcrack.py patch  "$DLL" --sites plan.json

      - name: package
        run: |
          set -euo pipefail
          package/package.sh windows app out

      - name: verify
        run: package/verify.sh out

      - uses: actions/upload-artifact@v4
        with:
          name: CloakBrowser-Manager-windows-x64
          path: out

  linux:
    needs: macos
    # The vendor publishes no Linux manager, so this ships the patched engine
    # (plus the Dockerfile path) and verifies it headless.
    runs-on: ubuntu-latest
    env:
      ENGINE_VERSION: ${{ inputs.version }}
      CB_KEY: ${{ inputs.key || secrets.CLOAKBROWSER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet --break-system-packages capstone

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libxshmfence1 \
            fonts-liberation
          # libasound2 is libasound2t64 from 24.04 on
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2

      - name: fetch engine
        run: |
          set -euo pipefail
          dl() {
            local url=$1 plat=$2 out=$3
            for i in 1 2 3 4 5; do
              code=$(curl -sSL --retry 3 -H "Authorization: Bearer $CB_KEY" \
                -H "X-Platform: $plat" -o "$out.tmp" -w '%{http_code}' "$url" || echo 000)
              if [ "$code" = 200 ]; then mv "$out.tmp" "$out"; return 0; fi
              echo "download $plat -> HTTP $code (attempt $i)"
              sleep $((i * 15))
            done
            return 1
          }
          ver=${ENGINE_VERSION:-$(curl -fsS https://cloakbrowser.dev/api/download/version | sed 's/.*"version":"\([^"]*\)".*/\1/')}
          dl "https://cloakbrowser.dev/api/download/$ver" linux-x64 engine.tar.gz
          mkdir engine && tar xzf engine.tar.gz -C engine
          chmod +x engine/chrome

      - name: derive patch plan
        run: |
          set -euo pipefail
          python3 cloakcrack.py derive engine/chrome --out plan.json
          python3 cloakcrack.py patch  engine/chrome --sites plan.json

      - name: package
        run: package/package.sh linux engine out

      - name: verify
        run: package/verify.sh out

      - uses: actions/upload-artifact@v4
        with:
          name: CloakBrowser-Manager-linux-x64
          path: out
